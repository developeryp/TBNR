# Haelt die Katalog-Seiten mit Firestore im Gleichstand.
#
# Laeuft einmal taeglich und bei jeder Aenderung am Erzeuger. Hat sich in
# Firestore nichts geaendert, entstehen identische Dateien und es wird nichts
# eingecheckt — der Lauf bleibt dann folgenlos.
#
# Von Hand ausloesen: Actions → Katalog erzeugen → Run workflow

name: Katalog erzeugen

on:
  schedule:
    - cron: "17 4 * * *"      # taeglich 4:17 UTC
  workflow_dispatch:

# Bewusst kein push-Ausloeser: Wer den Erzeuger aendert, laesst ihn oertlich
# laufen und checkt das Ergebnis gleich mit ein. Liefe die Action zusaetzlich
# bei jedem Push, schoebe sie einen eigenen Commit dazwischen und der naechste
# Push von Hand wuerde abgewiesen.

permissions:
  contents: write

jobs:
  erzeugen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Seiten aus Firestore erzeugen
        run: node werkzeug/erzeuge.mjs

      - name: Aenderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen — Firestore unveraendert."
          else
            git commit -m "Katalog aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
